name: Apply media containment patch

on:
  push:
    branches:
      - automation/media-dependency-containment-20260909

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/media-dependency-containment-20260909
          fetch-depth: 0
      - run: python scripts-apply-media-patch.py
      - run: |
          git config user.name dharan
          git config user.email 150376358+dharan1007@users.noreply.github.com
          git add -A
          git commit -m "fix: surface blocked media dependencies as unsafe network evidence"
          git push origin HEAD:automation/media-dependency-containment-20260909
