name: apply-dom-attribute
on:
  push:
    branches:
      - automation/dom-attribute-oracle-20260909
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run DOM attribute oracle patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/apply-dom-attribute.mjs
      - run: node --check src/runtime.js && node --check tests/oracle-dom-attribute.mjs
      - name: Commit implementation and remove temporary machinery
        run: |
          git config user.name dharan
          git config user.email '150376358+dharan1007@users.noreply.github.com'
          git rm .github/scripts/apply-dom-attribute.mjs .github/workflows/apply-dom-attribute.yml .github/workflows/red-dom-attribute.yml
          git add src/runtime.js index.html package.json docs/WEBMCP.md tests/oracle-dom-attribute.mjs
          git commit -m 'feat: add deterministic DOM attribute oracle'
          git push origin HEAD:automation/dom-attribute-oracle-20260909
