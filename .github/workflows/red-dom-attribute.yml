name: red-dom-attribute
on:
  push:
    branches:
      - automation/dom-attribute-oracle-20260909
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/oracle-dom-attribute.mjs
