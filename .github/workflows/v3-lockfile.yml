name: v3-lockfile
on:
  push:
    branches:
      - feat/faultline-v3-causal-platform
    paths:
      - .github/workflows/v3-lockfile.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/faultline-v3-causal-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock V3 workspace dependencies"
          git push origin HEAD:feat/faultline-v3-causal-platform
