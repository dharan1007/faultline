name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: node --check src/capture-format.js && node --check src/capture-runtime.js && node --check integrations/playwright/index.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/playwright-capture-integration.mjs
      - run: npm run test:browser
