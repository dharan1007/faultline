name: Promote verified FAULTLINE production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faultline-production
  cancel-in-progress: false

jobs:
  verify-deploy-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_APBZJjf6iizHCTuseqHosFnU
      VERCEL_PROJECT_ID: prj_XtQdMYG2kOufYTrZ1SDj61VEExDM
      VERCEL_PRODUCTION_BRANCH: production
      VERCEL_PRODUCTION_URL: https://faultline-webmcp.vercel.app
    steps:
      - name: Check out exact production candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record immutable source SHA
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git branch --show-current)" = "main"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify deterministic core
        run: npm test

      - name: Verify JavaScript syntax
        run: npm run check

      - name: Verify production tree
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify real browser and WebMCP behavior
        run: npm run test:browser

      - name: Refuse stale main candidate
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          CURRENT_MAIN=$(git rev-parse origin/main)
          test "$SOURCE_SHA" = "$CURRENT_MAIN" || {
            echo "main advanced from $SOURCE_SHA to $CURRENT_MAIN while verification ran; refusing stale production deployment"
            exit 1
          }

      - name: Verify production branch can fast-forward
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$VERCEL_PRODUCTION_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$VERCEL_PRODUCTION_BRANCH"
            git merge-base --is-ancestor "origin/$VERCEL_PRODUCTION_BRANCH" "$SOURCE_SHA" || {
              echo "production branch is not an ancestor of verified source; refusing non-fast-forward promotion"
              exit 1
            }
          fi

      - name: Require Vercel deployment credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || {
            echo "::error::VERCEL_TOKEN repository secret is required for exact-project production deployment"
            exit 1
          }

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Bind checkout to existing Vercel project
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          cat .vercel/project.json

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build exact verified tree for Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Create staged production deployment without moving domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          test -n "$DEPLOYMENT_URL"
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "Staged exact verified tree at $DEPLOYMENT_URL"

      - name: Smoke-test staged deployment against verified source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for file in index.html src/runtime.js src/ui.js src/reducer-engine.js src/sandbox-policy.js; do
            if [ "$file" = "index.html" ]; then
              remote_path="/"
            else
              remote_path="/$file"
            fi
            output="/tmp/faultline-staged-${file//\//-}"
            vercel --token="$VERCEL_TOKEN" curl "$remote_path" --deployment "$DEPLOYMENT_URL" > "$output"
            cmp "$file" "$output"
          done

      - name: Promote staged deployment to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN"

      - name: Verify public production alias serves exact tree
        run: |
          set -euo pipefail
          MATCHED=0
          for attempt in $(seq 1 18); do
            TREE_MATCHED=1
            for file in index.html src/runtime.js src/ui.js src/reducer-engine.js src/sandbox-policy.js; do
              if [ "$file" = "index.html" ]; then
                remote_path="/"
              else
                remote_path="/$file"
              fi
              output="/tmp/faultline-live-${file//\//-}"
              if ! curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "$VERCEL_PRODUCTION_URL$remote_path" -o "$output" || ! cmp -s "$file" "$output"; then
                TREE_MATCHED=0
                break
              fi
            done
            if [ "$TREE_MATCHED" = 1 ]; then
              MATCHED=1
              break
            fi
            sleep 5
          done
          test "$MATCHED" = 1 || {
            echo "::error::Production alias did not converge to the complete verified source tree"
            exit 1
          }

      - name: Mark exact deployed tree as production source
        run: |
          set -euo pipefail
          git push origin "$SOURCE_SHA:refs/heads/$VERCEL_PRODUCTION_BRANCH"
          echo "Deployed and promoted verified source SHA $SOURCE_SHA"
          echo "Vercel project: $VERCEL_PROJECT_ID ($VERCEL_ORG_ID)"
          echo "Production URL: $VERCEL_PRODUCTION_URL"
