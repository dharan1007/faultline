name: diagnose-action-sequence
on:
  push:
    branches:
      - automation/action-sequence-20260909
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/action-sequence-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture isolated sequence test
        run: |
          mkdir -p diagnostics
          set +e
          node tests/oracle-action-sequence.mjs > diagnostics/action-sequence.txt 2>&1
          code=$?
          echo "exit_code=$code" >> diagnostics/action-sequence.txt
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "dharan"
          git config user.email "150376358+dharan1007@users.noreply.github.com"
          git add diagnostics/action-sequence.txt
          git commit -m "chore: capture action sequence diagnostic" || exit 0
          git push origin HEAD:automation/action-sequence-20260909
