name: Apply CSP-compatible trusted result channel fix
on:
  push:
    branches: [tdd/result-forgery-containment]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch candidate execution without eval
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/runtime.js')
          s=p.read_text()
          old="const executeCandidate=()=>{try{(0,eval)(candidateSource)}catch(e){runtimeError=String(e&&e.message||e)}};"
          new="const executeCandidate=()=>{try{const script=document.createElement('script');script.textContent=candidateSource;document.body.appendChild(script);script.remove()}catch(e){runtimeError=String(e&&e.message||e)}};"
          if old not in s:
              raise SystemExit('expected eval candidate executor not found')
          p.write_text(s.replace(old,new,1))
      - name: Remove one-shot patch workflow
        run: git rm .github/workflows/apply-result-channel-fix.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime.js .github/workflows/apply-result-channel-fix.yml
          git commit -m 'fix: execute sandbox candidate without eval'
          git push
