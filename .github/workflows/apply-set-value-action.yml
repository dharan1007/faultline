name: Apply set_value oracle action

on:
  push:
    branches: [automation/set-value-action-20260909]
    paths: [.github/workflows/apply-set-value-action.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/set-value-action-20260909
      - name: Apply production implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          runtime='src/runtime.js'
          replace_once(runtime,
              "const ACTION_KINDS=['none','click'];",
              "const ACTION_KINDS=['none','click','set_value'];")
          replace_once(runtime,
              "if(Object.keys(oracle.action).some(key=>!['kind','selector'].includes(key))||!ACTION_KINDS.includes(oracle.action.kind))throw new Error('INVALID_ORACLE');",
              "if(Object.keys(oracle.action).some(key=>!['kind','selector','value'].includes(key))||!ACTION_KINDS.includes(oracle.action.kind))throw new Error('INVALID_ORACLE');")
          replace_once(runtime,
              "if(oracle.action.kind==='click'&&typeof oracle.action.selector!=='string')throw new Error('INVALID_ORACLE');",
              "if(oracle.action.kind==='click'&&typeof oracle.action.selector!=='string')throw new Error('INVALID_ORACLE');\n  if(oracle.action.kind==='set_value'&&(typeof oracle.action.selector!=='string'||!oracle.action.selector.trim()||typeof oracle.action.value!=='string'))throw new Error('INVALID_ORACLE');")
          replace_once(runtime,
              "if(o.action?.kind==='click'){const target=querySelector(o.action.selector);if(!target)throw new Error('ACTION_TARGET_NOT_FOUND');target.click()}",
              "if(o.action?.kind==='click'){const target=querySelector(o.action.selector);if(!target)throw new Error('ACTION_TARGET_NOT_FOUND');target.click()}\n  else if(o.action?.kind==='set_value'){\n   const target=querySelector(o.action.selector);\n   if(!target)throw new Error('ACTION_TARGET_NOT_FOUND');\n   let prototype=target,valueDescriptor=null;\n   while((prototype=Object.getPrototypeOf(prototype))&&!valueDescriptor)valueDescriptor=Object.getOwnPropertyDescriptor(prototype,'value');\n   if(!valueDescriptor?.set)throw new Error('ACTION_TARGET_NOT_VALUE_CONTROL');\n   valueDescriptor.set.call(target,String(o.action.value));\n   target.dispatchEvent(new Event('input',{bubbles:true,composed:true}));\n   target.dispatchEvent(new Event('change',{bubbles:true}));\n  }")
          replace_once(runtime,
              "$('action-selector').value=s.case.oracle.action?.selector||'';renderUnits();",
              "$('action-selector').value=s.case.oracle.action?.selector||'';$('action-value').value=s.case.oracle.action?.value??'';renderUnits();")
          replace_once(runtime,
              "action:{type:'object',additionalProperties:false,properties:{kind:{type:'string',enum:ACTION_KINDS},selector:{type:'string'}},required:['kind']}",
              "action:{type:'object',additionalProperties:false,properties:{kind:{type:'string',enum:ACTION_KINDS},selector:{type:'string'},value:{type:'string'}},required:['kind']}")
          replace_once(runtime,
              "$('lock').onclick=()=>defineOracle({oracle:{kind:$('oracle-kind').value,selector:$('oracle-selector').value,property:$('oracle-property').value,equals:normalizeExpected($('oracle-equals').value),action:{kind:$('action-kind').value,selector:$('action-selector').value},delayMs:0}});",
              "$('lock').onclick=()=>{const actionKind=$('action-kind').value;const action={kind:actionKind,selector:$('action-selector').value};if(actionKind==='set_value')action.value=$('action-value').value;defineOracle({oracle:{kind:$('oracle-kind').value,selector:$('oracle-selector').value,property:$('oracle-property').value,equals:normalizeExpected($('oracle-equals').value),action,delayMs:0}});};")

          index='index.html'
          replace_once(index,
              '<select id="action-kind"><option value="click">Click element</option><option value="none">No action</option></select>',
              '<select id="action-kind"><option value="click">Click element</option><option value="set_value">Set form value</option><option value="none">No action</option></select>')
          replace_once(index,
              '<div class="row"><div><label for="action-kind">Before measurement</label><select id="action-kind"><option value="click">Click element</option><option value="set_value">Set form value</option><option value="none">No action</option></select></div><div><label for="action-selector">Action selector</label><input id="action-selector" value="#save"></div></div>',
              '<div class="row"><div><label for="action-kind">Before measurement</label><select id="action-kind"><option value="click">Click element</option><option value="set_value">Set form value</option><option value="none">No action</option></select></div><div><label for="action-selector">Action selector</label><input id="action-selector" value="#save"></div></div>\n          <div><label for="action-value">Action value</label><input id="action-value" value="" autocomplete="off" aria-describedby="action-value-help"><span id="action-value-help" class="small">Used by “Set form value”; ignored by click and no-action runs.</span></div>')

          contract='tests/oracle-contract-validation.mjs'
          replace_once(contract,
              "assert.deepEqual(schema.properties.action.properties.kind.enum,['none','click'],'WebMCP schema must enumerate supported action kinds');",
              "assert.deepEqual(schema.properties.action.properties.kind.enum,['none','click','set_value'],'WebMCP schema must enumerate supported action kinds');\n  assert.equal(schema.properties.action.properties.value.type,'string','WebMCP schema must advertise set_value action payloads');")
          PY
      - name: Commit implementation and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name dharan
          git config user.email 150376358+dharan1007@users.noreply.github.com
          git rm .github/workflows/apply-set-value-action.yml
          git add src/runtime.js index.html tests/oracle-contract-validation.mjs
          git commit -m "feat: add deterministic set_value oracle action"
          git push origin HEAD:automation/set-value-action-20260909
