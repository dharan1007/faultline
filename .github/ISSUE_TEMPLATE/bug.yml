name: Bug report
description: Report a reproducible FAULTLINE defect that is not a private security vulnerability
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Semantic unit discovery
        - Probe
        - Reduce / Autopilot
        - Oracle
        - Sandbox / execution
        - Persistence / revision recovery
        - Export / import
        - WebMCP
        - UI / accessibility
        - Deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected PASS / FAIL / UNRESOLVED behavior
    validations:
      required: true
  - type: textarea
    id: case
    attributes:
      label: Minimal synthetic HTML/CSS/JS + oracle
      description: Do not include private/customer source.
      render: text
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / console / revision trace
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues first.
          required: true
        - label: This case contains no private/customer data or credentials.
          required: true
        - label: This is not an undisclosed sandbox/security vulnerability.
          required: true
