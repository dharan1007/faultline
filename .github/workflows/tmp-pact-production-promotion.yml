name: Temporary PACT production promotion

on:
  push:
    branches:
      - ops/pact-prod-8ae0c8e3-20260908
    paths:
      - .github/workflows/tmp-pact-production-promotion.yml

permissions:
  contents: read

concurrency:
  group: temporary-pact-production-promotion
  cancel-in-progress: false

jobs:
  promote-pact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PACT_SHA: 8ae0c8e3b5335c7cf7b33ee8b4cd57342a33ad5d
      PACT_BRANCH: hardening/real-rest-provider-20260905
      VERCEL_ORG_ID: team_APBZJjf6iizHCTuseqHosFnU
      VERCEL_PROJECT_ID: prj_4a7E35CAWFjsdq04HieKX5VUvv6V
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PACT_PRODUCTION_URL: https://pact-webmcp.vercel.app
      PACT_SOURCE_COMMIT: 8ae0c8e3b5335c7cf7b33ee8b4cd57342a33ad5d

    steps:
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify exact PACT release authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "PACT_VERCEL_CREDENTIAL_UNAVAILABLE" >&2; exit 1; }
          curl -fsS 'https://api.github.com/repos/dharan1007/pact/branches/hardening%2Freal-rest-provider-20260905' > /tmp/pact-branch.json
          PACT_SHA="$PACT_SHA" node --input-type=module -e "import fs from 'node:fs'; const b=JSON.parse(fs.readFileSync('/tmp/pact-branch.json','utf8')); if(b.commit?.sha!==process.env.PACT_SHA) throw new Error('PACT hardening head moved; refusing stale promotion');"
          curl -fsS 'https://api.github.com/repos/dharan1007/pact/actions/runs?branch=hardening%2Freal-rest-provider-20260905&per_page=30' > /tmp/pact-runs.json
          PACT_SHA="$PACT_SHA" node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('/tmp/pact-runs.json','utf8')); const ok=(r.workflow_runs??[]).some(x=>x.head_sha===process.env.PACT_SHA&&x.name==='verify'&&x.status==='completed'&&x.conclusion==='success'); if(!ok) throw new Error('No successful PACT verify run for pinned release SHA');"

      - name: Check out exact PACT release
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/dharan1007/pact.git pact
          cd pact
          git fetch --depth=1 origin "$PACT_SHA"
          git checkout --detach "$PACT_SHA"
          test "$(git rev-parse HEAD)" = "$PACT_SHA"

      - name: Verify repository before deployment
        working-directory: pact
        shell: bash
        run: |
          set -euo pipefail
          npm run verify

      - name: Pull PACT production project configuration
        working-directory: pact
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Export PACT production smoke configuration
        working-directory: pact
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 env pull .pact-production.env --yes --environment=production --token="$VERCEL_TOKEN"
          test -s .pact-production.env || { echo "PACT_PRODUCTION_ENV_PULL_FAILED" >&2; exit 1; }

      - name: Build PACT production artifact
        working-directory: pact
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 build --prod --token="$VERCEL_TOKEN"

      - name: Verify exact PACT prebuilt artifact
        working-directory: pact
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:prebuilt

      - name: Stage PACT production artifact
        id: stage
        working-directory: pact
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@59.11.7 deploy --prebuilt --prod --skip-domain --env PACT_SOURCE_COMMIT="$PACT_SOURCE_COMMIT" --token="$VERCEL_TOKEN" | tail -n 1)"
          if [[ ! "$deployment_url" =~ ^https://[^[:space:]]+\.vercel\.app$ ]]; then
            echo "PACT_STAGED_DEPLOYMENT_URL_INVALID" >&2
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify immutable staged PACT deployment
        working-directory: pact
        shell: bash
        env:
          PACT_PRODUCTION_URL: ${{ steps.stage.outputs.deployment_url }}
          PACT_EXPECTED_RELEASE_SHA: 8ae0c8e3b5335c7cf7b33ee8b4cd57342a33ad5d
        run: |
          set -euo pipefail
          npm run verify:production

      - name: Execute real PACT provider transaction
        working-directory: pact
        shell: bash
        env:
          PACT_PRODUCTION_URL: ${{ steps.stage.outputs.deployment_url }}
        run: |
          set -euo pipefail
          node --env-file=.pact-production.env scripts/verify-production-smoke.mjs

      - name: Remove pulled PACT production environment
        if: always()
        working-directory: pact
        shell: bash
        run: rm -f .pact-production.env

      - name: Promote verified staged PACT deployment
        working-directory: pact
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 promote "${{ steps.stage.outputs.deployment_url }}" --yes --token="$VERCEL_TOKEN"

      - name: Verify live PACT production alias
        working-directory: pact
        shell: bash
        env:
          PACT_PRODUCTION_URL: https://pact-webmcp.vercel.app
          PACT_EXPECTED_RELEASE_SHA: 8ae0c8e3b5335c7cf7b33ee8b4cd57342a33ad5d
        run: |
          set -euo pipefail
          npm run verify:production
