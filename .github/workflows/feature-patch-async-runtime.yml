name: feature-patch-async-runtime
on:
  push:
    branches:
      - fix/runtime-error-unhandled-rejection
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-error-unhandled-rejection
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact sandbox patch
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='src/runtime.js';
          const source=fs.readFileSync(path,'utf8');
          const before=" addEventListener('error',e=>{runtimeError=String(e.error?.message??e.message??e.error??'runtime error');e.preventDefault()});\n";
          const after=before+" addEventListener('unhandledrejection',e=>{runtimeError=String(e.reason?.message??e.reason??'unhandled rejection');e.preventDefault()});\n";
          if(source.includes("addEventListener('unhandledrejection'")) process.exit(0);
          if(!source.includes(before)) throw new Error('expected sandbox runtime-error listener not found');
          fs.writeFileSync(path,source.replace(before,after));
          NODE
          git diff --check
          node --check src/runtime.js
      - name: Commit feature fix
        shell: bash
        run: |
          if git diff --quiet -- src/runtime.js; then exit 0; fi
          git config user.name 'faultline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add src/runtime.js
          git commit -m 'fix: capture unhandled promise rejections as runtime errors'
          git push origin HEAD:fix/runtime-error-unhandled-rejection
