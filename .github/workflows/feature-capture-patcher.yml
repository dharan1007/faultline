name: feature capture integration patcher
on:
  push:
    branches:
      - feature/playwright-capture-v1-20260909
    paths:
      - scripts/apply-capture-runtime.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playwright-capture-v1-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-capture-runtime.mjs
      - run: node --check tests/browser-e2e.mjs
      - run: node --check src/capture-contract.js
      - run: node --check integrations/playwright-capture/index.js
      - name: Commit deterministic integration contract patch
        run: |
          git config user.name "faultline-automation"
          git config user.email "150376358+dharan1007@users.noreply.github.com"
          git add tests/browser-e2e.mjs package.json .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No integration contract changes"
            exit 0
          fi
          git commit -m "test: align production gates with capture ingestion"
          git push origin HEAD:feature/playwright-capture-v1-20260909
