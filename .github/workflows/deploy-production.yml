name: Promote verified FAULTLINE production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faultline-production
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_APBZJjf6iizHCTuseqHosFnU
      VERCEL_PROJECT_ID: prj_XtQdMYG2kOufYTrZ1SDj61VEExDM
      VERCEL_PRODUCTION_BRANCH: production
    steps:
      - name: Check out exact production candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record immutable source SHA
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git branch --show-current)" = "main"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify deterministic core
        run: npm test

      - name: Verify JavaScript syntax
        run: npm run check

      - name: Verify production tree
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify real browser and WebMCP behavior
        run: npm run test:browser

      - name: Refuse stale main candidate
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          CURRENT_MAIN=$(git rev-parse origin/main)
          test "$SOURCE_SHA" = "$CURRENT_MAIN" || {
            echo "main advanced from $SOURCE_SHA to $CURRENT_MAIN while verification ran; refusing stale production promotion"
            exit 1
          }

      - name: Verify production branch can fast-forward
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$VERCEL_PRODUCTION_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$VERCEL_PRODUCTION_BRANCH"
            git merge-base --is-ancestor "origin/$VERCEL_PRODUCTION_BRANCH" "$SOURCE_SHA" || {
              echo "production branch is not an ancestor of verified source; refusing non-fast-forward promotion"
              exit 1
            }
          fi

      - name: Promote exact green tree
        run: |
          set -euo pipefail
          git push origin "$SOURCE_SHA:refs/heads/$VERCEL_PRODUCTION_BRANCH"
          echo "Promoted verified source SHA $SOURCE_SHA to $VERCEL_PRODUCTION_BRANCH"
          echo "Vercel project: $VERCEL_PROJECT_ID ($VERCEL_ORG_ID)"
