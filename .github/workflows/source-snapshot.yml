name: faultline-source-snapshot
on:
  push:
    branches: [hardening/production-100-20260915]
  pull_request:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create exact source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=faultline-source.tgz -czf faultline-source.tgz .
          sha256sum faultline-source.tgz > faultline-source.tgz.sha256
      - name: Upload exact source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faultline-source-${{ github.sha }}
          path: |
            faultline-source.tgz
            faultline-source.tgz.sha256
          retention-days: 1
          if-no-files-found: error
