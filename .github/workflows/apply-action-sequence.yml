name: apply-action-sequence
on:
  push:
    branches:
      - automation/action-sequence-20260909
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/action-sequence-20260909
      - name: Apply bounded action-sequence implementation
        run: python scripts/apply-action-sequence-patch.py
      - name: Commit implementation and remove temporary patch machinery
        run: |
          git config user.name "dharan"
          git config user.email "150376358+dharan1007@users.noreply.github.com"
          git rm .github/workflows/apply-action-sequence.yml scripts/apply-action-sequence-patch.py
          git add src/runtime.js index.html
          git diff --cached --check
          git commit -m "feat: support bounded oracle action sequences"
          git push origin HEAD:automation/action-sequence-20260909
