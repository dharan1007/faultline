name: apply-webmcp-native-execution-signal-v2

on:
  push:
    branches:
      - fix/webmcp-native-execution-signal-20260906
    paths:
      - .github/workflows/apply-webmcp-native-execution-signal-v2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts-apply-webmcp-native-signal.mjs
      - run: rm -f .github/workflows/webmcp-native-execution-signal-red.yml .github/workflows/apply-webmcp-native-execution-signal.yml .github/workflows/apply-webmcp-native-execution-signal-v2.yml scripts-apply-webmcp-native-signal.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: rm -f package-lock.json
      - run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && git commit -m "fix: honor native WebMCP execution cancellation" && git push origin HEAD:fix/webmcp-native-execution-signal-20260906
