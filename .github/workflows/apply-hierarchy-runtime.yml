name: Apply hierarchy runtime patch
on:
  push:
    branches: [automation/hierarchical-reduction-20260909]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'chore: add hierarchy runtime applicator'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/hierarchical-reduction-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-hierarchy-runtime.mjs
      - run: node --check src/runtime.js
      - name: Commit exact runtime change and remove applicator
        run: |
          rm scripts/patch-hierarchy-runtime.mjs .github/workflows/apply-hierarchy-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime.js scripts/patch-hierarchy-runtime.mjs .github/workflows/apply-hierarchy-runtime.yml
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "feat: implement hierarchical canonical reduction"
          git push origin HEAD:automation/hierarchical-reduction-20260909
