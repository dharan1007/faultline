name: Apply experiment CSP inheritance patch
on:
  push:
    branches:
      - fix/canonical-preview-isolation
    paths:
      - .github/workflows/apply-preview-csp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-preview-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply runtime patch
        run: node scripts-apply-preview-csp.cjs
      - name: Verify patched syntax
        run: node --check src/runtime.js
      - name: Commit runtime fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime.js
          git diff --cached --check
          git commit -m "fix: preserve CSP on ephemeral experiment sandboxes"
          git push origin HEAD:fix/canonical-preview-isolation
