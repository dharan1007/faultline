name: apply-runtime-revision-hydration-fix

on:
  push:
    branches:
      - fix/runtime-revision-hydration-integrity
    paths:
      - .github/workflows/apply-runtime-revision-hydration-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal runtime hydration bound
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/runtime.js')
          text = path.read_text()
          old = "function validRevisionEntry(entry){ return Array.isArray(entry)&&entry.length===2&&/^r[1-9]\\d*$/.test(String(entry[0]))&&entry[1]?.value; }"
          new = "function validRevisionEntry(entry){ return Array.isArray(entry)&&entry.length===2&&/^r[1-9]\\d*$/.test(String(entry[0]))&&entry[1]?.value&&Number(String(entry[0]).slice(1))<=Number(revision().slice(1)); }"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one validator occurrence, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/apply-runtime-revision-hydration-fix.yml
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Commit exact green tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bound runtime recovery hydration to canonical revision"
          git push origin HEAD:fix/runtime-revision-hydration-integrity
