name: deploy-production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character current-main FAULTLINE commit SHA to promote
        required: true
        type: string
  workflow_run:
    workflows: ["self-hosted-qualification"]
    types: [completed]

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: faultline-production
  cancel-in-progress: false

env:
  CANONICAL_URL: https://faultline-webmcp.vercel.app
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: team_APBZJjf6iizHCTuseqHosFnU
  VERCEL_PROJECT_ID: prj_XtQdMYG2kOufYTrZ1SDj61VEExDM

jobs:
  deploy:
    name: deploy exact organizationally qualified release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Linux, X64, production-ci]
    timeout-minutes: 90
    environment: production
    steps:
      - name: Resolve exact qualified release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.release_sha }}
          QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="${DISPATCH_SHA:-}"
          if [ "$EVENT_NAME" = workflow_run ]; then release_sha="${QUALIFIED_SHA:-}"; fi
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "FAULTLINE_RELEASE_SHA_INVALID"; exit 1; }
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_SHA=$release_sha" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.release_sha }}
          fetch-depth: 0
          clean: true

      - name: Prove exact current-main source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "FAULTLINE_RELEASE_CHECKOUT_MISMATCH"; exit 1; }
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA" || { echo "FAULTLINE_RELEASE_NOT_CURRENT_MAIN_HEAD"; exit 1; }
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo "FAULTLINE_RELEASE_DIRTY"; exit 1; }

      - name: Require exact-SHA organizational qualification and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          checks="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs")"
          qual_ok="$(jq '[.check_runs[] | select(.name == "self-hosted organizational qualification" and .conclusion == "success")] | length' <<<"$checks")"
          codeql_ok="$(jq '[.check_runs[] | select(.name == "self-hosted organizational codeql" and .conclusion == "success")] | length' <<<"$checks")"
          test "$qual_ok" -ge 1 || { echo "FAULTLINE_ORGANIZATIONAL_QUALIFICATION_NOT_GREEN"; exit 1; }
          test "$codeql_ok" -ge 1 || { echo "FAULTLINE_ORGANIZATIONAL_CODEQL_NOT_GREEN"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Re-run source verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=high --omit=dev
          npm test
          npm run check
          node --check src/external-live-qualification-runner.js
          node --check scripts/run-organizational-qualification.mjs
          node --check scripts/verify-live-deployment.mjs
          node --test tests/external-qualification-runner.test.js tests/external-live-qualification-runner.test.js tests/deploy-production-contract.test.js
          GITHUB_SHA="$EXPECTED_SHA" GITHUB_REPOSITORY="${{ github.repository }}" GITHUB_REF_NAME=main npm run build
          npm run sbom
          npm run verify:package

      - name: Install production smoke browser
        run: ./node_modules/.bin/playwright install chromium

      - name: Require deploy credential and pull production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN_REQUIRED"; exit 1; }
          npx --yes vercel@59.11.7 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build exact production-configured artifact
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$EXPECTED_SHA" GITHUB_REPOSITORY="${{ github.repository }}" GITHUB_REF_NAME=main npx --yes vercel@59.11.7 build --prod --token="$VERCEL_TOKEN"

      - name: Stage without assigning production domains
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@59.11.7 deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN" | tail -n 1)"
          [[ "$deployment_url" =~ ^https://[^[:space:]]+\.vercel\.app$ ]] || { echo "FAULTLINE_STAGED_DEPLOYMENT_URL_INVALID"; exit 1; }
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify immutable staged provenance, integrity and browser runtime
        run: node scripts/verify-live-deployment.mjs "${{ steps.stage.outputs.deployment_url }}" "$EXPECTED_SHA"

      - name: Promote only verified staged deployment
        run: npx --yes vercel@59.11.7 promote "${{ steps.stage.outputs.deployment_url }}" --yes --token="$VERCEL_TOKEN"

      - name: Verify canonical production after promotion
        run: node scripts/verify-live-deployment.mjs "$CANONICAL_URL" "$EXPECTED_SHA"
