name: automation-iframe-fix
on:
  push:
    branches: [automation/iframe-containment-11]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply verified iframe policy patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/iframe-containment-11
      - name: Patch external frame policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/sandbox-policy.js')
          s=p.read_text()
          marker="\nfunction containsExternalStylesheetImport(source){"
          helper=r'''

function isBlockedFrameSource(source){
  const src=String(source??'').trim();
  return Boolean(src)&&!/^about:blank(?:[?#]|$)/i.test(src);
}

function containsExternalFrame(source){
  const html=String(source??'');
  if(typeof DOMParser==='function'){
    const doc=new DOMParser().parseFromString(html,'text/html');
    for(const frame of doc.querySelectorAll('iframe[src]')){
      if(frame.hasAttribute('srcdoc'))continue;
      if(isBlockedFrameSource(frame.getAttribute('src')))return true;
    }
    return false;
  }
  const withoutComments=html.replace(/<!--[\s\S]*?-->/g,'');
  for(const match of withoutComments.matchAll(/<iframe\b[^>]*>/gi)){
    const tag=match[0];
    if(/\bsrcdoc\s*=/i.test(tag))continue;
    const src=tag.match(/\bsrc\s*=\s*(?:\"([^\"]*)\"|'([^']*)'|([^\s>]+))/i);
    const srcValue=String(src?.[1]??src?.[2]??src?.[3]??'').trim();
    if(isBlockedFrameSource(srcValue))return true;
  }
  return false;
}
'''
          if 'function containsExternalFrame(source)' in s:
              raise SystemExit('helper already present')
          if marker not in s:
              raise SystemExit('insertion marker not found')
          s=s.replace(marker,helper+marker,1)
          old="  if(containsExternalImage(html))return {reason:'UNSAFE_NETWORK',axis:'html',capability:'external-image'};\n"
          new=old+"  if(containsExternalFrame(html))return {reason:'UNSAFE_NETWORK',axis:'html',capability:'external-frame'};\n"
          if old not in s:
              raise SystemExit('navigationRisk marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'dharan'
          git config user.email '150376358+dharan1007@users.noreply.github.com'
          git add src/sandbox-policy.js
          git commit -m 'fix: surface blocked iframe dependencies as unsafe network evidence'
          git push origin HEAD:automation/iframe-containment-11
