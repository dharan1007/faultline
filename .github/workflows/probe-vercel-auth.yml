name: Probe Vercel CI authentication
on:
  push:
    branches: [probe/vercel-auth-2026-09-11]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_APBZJjf6iizHCTuseqHosFnU
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify repository has non-empty Vercel deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN is not configured for this repository.' >&2
            exit 1
          fi
          echo 'VERCEL_TOKEN is configured; value remains masked and is not printed.'
      - name: Verify token can access both production projects
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.15.1 project inspect faultline-webmcp --team "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN" >/tmp/faultline-project.txt
          npx --yes vercel@59.15.1 project inspect kata-webmcp --team "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN" >/tmp/kata-project.txt
          grep -q 'faultline-webmcp' /tmp/faultline-project.txt
          grep -q 'kata-webmcp' /tmp/kata-project.txt
          echo 'Masked Vercel credential can access both FAULTLINE and KATA projects.'
