name: apply inline css policy fix
on:
  push:
    branches:
      - automation/html-inline-css-containment-20260909
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply inline HTML CSS policy patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal tested policy fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/sandbox-policy.js')
          text=path.read_text()
          anchor="function computedGlobalRisk(source){"
          insert=r'''function containsExternalInlineCssResource(source){
            const html=String(source??'');
            if(typeof DOMParser==='function'){
              const doc=new DOMParser().parseFromString(html,'text/html');
              for(const style of doc.querySelectorAll('style')){
                const css=String(style.textContent??'');
                if(containsExternalStylesheetImport(css)||containsExternalCssResource(css))return true;
              }
              for(const element of doc.querySelectorAll('[style]')){
                if(containsExternalCssResource(element.getAttribute('style')))return true;
              }
              return false;
            }
            const withoutComments=html.replace(/<!--[\s\S]*?-->/g,'');
            for(const match of withoutComments.matchAll(/<style\b[^>]*>([\s\S]*?)<\/style\s*>/gi)){
              if(containsExternalStylesheetImport(match[1])||containsExternalCssResource(match[1]))return true;
            }
            for(const match of withoutComments.matchAll(/<[^>]+\bstyle\s*=\s*(?:"([^"]*)"|'([^']*)')[^>]*>/gi)){
              const css=String(match[1]??match[2]??'');
              if(containsExternalCssResource(css))return true;
            }
            return false;
          }

          '''
          if 'function containsExternalInlineCssResource(source)' not in text:
              if anchor not in text:
                  raise SystemExit('computedGlobalRisk anchor missing')
              text=text.replace(anchor,insert+anchor,1)
          nav_anchor="  if(containsBlockedEmbeddedObject(html))return {reason:'UNSAFE_NETWORK',axis:'html',capability:'external-embedded-object'};\n"
          nav_insert=nav_anchor+"  if(containsExternalInlineCssResource(html))return {reason:'UNSAFE_NETWORK',axis:'html',capability:'external-inline-css-resource'};\n"
          if "capability:'external-inline-css-resource'" not in text:
              if nav_anchor not in text:
                  raise SystemExit('navigationRisk HTML anchor missing')
              text=text.replace(nav_anchor,nav_insert,1)
          path.write_text(text)
          PY
          rm .github/workflows/apply-inline-css-fix.yml
          git config user.name dharan
          git config user.email '150376358+dharan1007@users.noreply.github.com'
          git add -A
          git commit -m 'fix: classify inline HTML CSS dependencies'
          git push origin HEAD:automation/html-inline-css-containment-20260909
