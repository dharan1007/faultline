name: apply-oracle-wait
on:
  push:
    branches:
      - automation/oracle-sequence-wait-20260909
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/oracle-sequence-wait-20260909
      - name: Apply bounded oracle wait implementation
        run: python scripts/apply-oracle-wait-patch.py
      - name: Commit implementation and remove temporary patch machinery
        run: |
          git config user.name "dharan"
          git config user.email "150376358+dharan1007@users.noreply.github.com"
          git rm .github/workflows/apply-oracle-wait.yml scripts/apply-oracle-wait-patch.py
          git add src/runtime.js index.html
          git diff --cached --check
          git commit -m "feat: support bounded oracle wait steps"
          git push origin HEAD:automation/oracle-sequence-wait-20260909
