name: Apply revision discovery patch
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/apply-revision-discovery.py
      - run: |
          git config user.name faultline-ci
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/apply-revision-discovery.yml scripts/apply-revision-discovery.py
          git add src/runtime.js src/ui.js tests/browser-e2e.mjs
          git commit -m "feat: expose recoverable revision discovery"
          git push origin HEAD:feat/recoverable-revision-discovery
