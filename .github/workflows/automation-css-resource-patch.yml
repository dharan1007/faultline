name: automation-css-resource-patch
on:
  push:
    branches:
      - automation/css-resource-containment-20260909
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/css-resource-containment-20260909
      - name: Patch policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/sandbox-policy.js')
          s=p.read_text()
          marker='\nfunction computedGlobalRisk(source){'
          if 'function containsExternalCssResource(source)' not in s:
              if marker not in s:
                  raise SystemExit('computedGlobalRisk insertion marker missing')
              addition=r'''

function isBlockedCssResourceSource(source){
  const src=String(source??'').trim();
  return Boolean(src)&&!/^(?:data|blob):/i.test(src)&&!/^#/.test(src);
}

function containsExternalCssResource(source){
  const css=String(source??'');
  let i=0;
  const skipComment=()=>{
    i+=2;
    while(i<css.length&&!(css[i]==='*'&&css[i+1]==='/'))i++;
    i=Math.min(css.length,i+2);
  };
  const skipWhitespace=()=>{while(i<css.length&&/\s/.test(css[i]))i++;};
  const readQuoted=quote=>{
    i++;
    let value='';
    while(i<css.length){
      if(css[i]==='\\'){
        if(i+1<css.length)value+=css[i+1];
        i+=2;
        continue;
      }
      if(css[i]===quote){i++;return value;}
      value+=css[i++];
    }
    return value;
  };
  while(i<css.length){
    const c=css[i];
    if(c==='/'&&css[i+1]==='*'){skipComment();continue;}
    if(c==="'"||c==='"'){readQuoted(c);continue;}
    const previous=css[i-1]||'';
    if(css.slice(i,i+3).toLowerCase()==='url'&&!/[-\w]/.test(previous)&&!/[-\w]/.test(css[i+3]||'')){
      i+=3;
      skipWhitespace();
      if(css[i]!=='(')continue;
      i++;
      skipWhitespace();
      let value='';
      if(css[i]==="'"||css[i]==='"')value=readQuoted(css[i]);
      else{
        while(i<css.length&&css[i]!==')'){
          if(css[i]==='\\'&&i+1<css.length){value+=css[i+1];i+=2;continue;}
          value+=css[i++];
        }
      }
      while(i<css.length&&css[i]!==')')i++;
      if(css[i]===')')i++;
      if(isBlockedCssResourceSource(value))return true;
      continue;
    }
    i++;
  }
  return false;
}
'''
              s=s.replace(marker,addition+marker,1)
          risk="  if(containsExternalStylesheetImport(css))return {reason:'UNSAFE_NETWORK',axis:'css',capability:'external-stylesheet-import'};"
          resource="  if(containsExternalCssResource(css))return {reason:'UNSAFE_NETWORK',axis:'css',capability:'external-css-resource'};"
          if resource not in s:
              if risk not in s:
                  raise SystemExit('navigationRisk CSS marker missing')
              s=s.replace(risk,risk+'\n'+resource,1)
          p.write_text(s)
          Path('tests/network-css-resource-containment.mjs').unlink(missing_ok=True)
          Path('.github/workflows/automation-css-resource-patch.yml').unlink(missing_ok=True)
          PY
      - name: Commit coherent candidate
        run: |
          git config user.name dharan
          git config user.email 150376358+dharan1007@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: surface blocked CSS url resources as unsafe network evidence"
          git push origin HEAD:automation/css-resource-containment-20260909
