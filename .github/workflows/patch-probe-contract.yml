name: One-shot probe contract patch
on:
  push:
    branches: [fix/webmcp-probe-readonly-contract]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: align probe WebMCP read-only annotation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webmcp-probe-readonly-contract
          fetch-depth: 0
      - name: Apply exact annotation patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/runtime.js')
          text=path.read_text()
          old="['faultline_probe','Test removing one semantic unit from the inspected canonical revision without mutating canonical state.',{...REVISION_PROPERTY,targetAxis:{type:'string',enum:['html','css','js']},unitId:{type:'string'}},async(input,options)=>probe(input,options),true,true,['expectedRevision','targetAxis','unitId']],"
          new="['faultline_probe','Test removing one semantic unit from the inspected canonical revision without mutating canonical state; the probe evidence trail is persisted.',{...REVISION_PROPERTY,targetAxis:{type:'string',enum:['html','css','js']},unitId:{type:'string'}},async(input,options)=>probe(input,options),false,true,['expectedRevision','targetAxis','unitId']],"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one probe definition, found {text.count(old)}')
          path.write_text(text.replace(old,new))
          PY
          rm .github/workflows/patch-probe-contract.yml
          git diff --check
          git diff -- src/runtime.js .github/workflows/patch-probe-contract.yml
      - name: Commit exact source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime.js .github/workflows/patch-probe-contract.yml
          git commit -m 'fix: align probe WebMCP read-only annotation'
          git push origin HEAD:fix/webmcp-probe-readonly-contract
