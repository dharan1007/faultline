name: ci
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply abort-listener lifecycle fix on feature branch
        if: github.ref == 'refs/heads/fix/webmcp-abort-listener-cleanup'
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/runtime.js')
          text=path.read_text()
          old="""  if(requestId)activeWebMCPOperations.set(requestId,{requestId,tool,startedAt:new Date().toISOString(),controller});
  try{
    throwIfAborted(signal);
    const abortPromise=signal?new Promise((_,reject)=>signal.addEventListener('abort',()=>reject(abortError()),{once:true})):null;
    const task=Promise.resolve().then(()=>execute(input,{signal}));
    return await (abortPromise?Promise.race([task,abortPromise]):task);
  }finally{
    if(requestId)activeWebMCPOperations.delete(requestId);
  }
"""
          new="""  if(requestId)activeWebMCPOperations.set(requestId,{requestId,tool,startedAt:new Date().toISOString(),controller});
  let abortListener=null;
  try{
    throwIfAborted(signal);
    const abortPromise=signal?new Promise((_,reject)=>{abortListener=()=>reject(abortError());signal.addEventListener('abort',abortListener,{once:true});}):null;
    const task=Promise.resolve().then(()=>execute(input,{signal}));
    return await (abortPromise?Promise.race([task,abortPromise]):task);
  }finally{
    if(signal&&abortListener)signal.removeEventListener('abort',abortListener);
    if(requestId)activeWebMCPOperations.delete(requestId);
  }
"""
          if text.count(old)!=1:
              raise SystemExit(f'expected one execution lifecycle block, found {text.count(old)}')
          path.write_text(text.replace(old,new))
          PY
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Commit exact green runtime tree
        if: github.ref == 'refs/heads/fix/webmcp-abort-listener-cleanup'
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/apply-webmcp-abort-listener-cleanup.yml
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime.js .github/workflows/ci.yml package.json tests/webmcp-abort-listener-cleanup.mjs
          git commit -m "fix: detach completed WebMCP abort listeners"
          git push origin HEAD:fix/webmcp-abort-listener-cleanup
