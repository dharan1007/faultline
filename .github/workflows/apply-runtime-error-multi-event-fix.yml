name: apply-runtime-error-multi-event-fix

on:
  push:
    branches:
      - fix/runtime-error-multi-event-oracle
    paths:
      - .github/workflows/apply-runtime-error-multi-event-fix.yml

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal multi-event runtime oracle fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/runtime.js')
          text=path.read_text()
          replacements=[
            (
              " let runtimeError=null;\n addEventListener('error',e=>{runtimeError=String(e.error?.message??e.message??e.error??'runtime error');e.preventDefault()});\n addEventListener('unhandledrejection',e=>{runtimeError=String(e.reason?.message??e.reason??'unhandled rejection');e.preventDefault()});\n const executeCandidate=()=>{try{const script=document.createElement('script');script.textContent=candidateSource;document.body.appendChild(script);script.remove()}catch(e){runtimeError=String(e&&e.message||e)}};",
              " const runtimeErrors=[];\n const captureRuntimeError=value=>runtimeErrors.push(String(value));\n addEventListener('error',e=>{captureRuntimeError(e.error?.message??e.message??e.error??'runtime error');e.preventDefault()});\n addEventListener('unhandledrejection',e=>{captureRuntimeError(e.reason?.message??e.reason??'unhandled rejection');e.preventDefault()});\n const executeCandidate=()=>{try{const script=document.createElement('script');script.textContent=candidateSource;document.body.appendChild(script);script.remove()}catch(e){captureRuntimeError(e&&e.message||e)}};"
            ),
            (
              "   if(o.kind==='runtime_error'){actual=runtimeError}",
              "   if(o.kind==='runtime_error'){const expectedRuntime=o.equals!==undefined?String(o.equals):undefined;actual=expectedRuntime===undefined?(runtimeErrors.at(-1)??null):(runtimeErrors.find(message=>same(message,expectedRuntime))??runtimeErrors.at(-1)??null)}"
            )
          ]
          for old,new in replacements:
            if text.count(old)!=1:
              raise SystemExit(f'expected one occurrence, found {text.count(old)} for {old[:80]!r}')
            text=text.replace(old,new)
          path.write_text(text)
          PY
          rm .github/workflows/apply-runtime-error-multi-event-fix.yml
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Commit exact green tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve locked runtime error across later exceptions"
          git push origin HEAD:fix/runtime-error-multi-event-oracle
