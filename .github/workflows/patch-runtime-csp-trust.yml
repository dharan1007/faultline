name: patch-runtime-csp-trust
on:
  push:
    branches:
      - automation/runtime-csp-trust-20260909
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'require trusted runtime CSP events') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/runtime-csp-trust-20260909
          fetch-depth: 0
      - name: Require browser-trusted CSP events
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/runtime.js')
          s=p.read_text()
          old="const reportRuntimePolicyViolation=event=>{\n  if(runtimePolicyViolation)return;"
          new="const reportRuntimePolicyViolation=event=>{\n  if(runtimePolicyViolation||!event.isTrusted)return;"
          assert old in s
          p.write_text(s.replace(old,new,1))
      - name: Verify targeted trust regression
        run: |
          npm install --no-audit --no-fund
          npm run check
          npx playwright install --with-deps chromium
          node tests/runtime-csp-resource-containment.mjs
      - name: Commit hardening
        run: |
          git config user.name "faultline-production-bot"
          git config user.email "150376358+dharan1007@users.noreply.github.com"
          git add src/runtime.js
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: require trusted runtime CSP events"
          git push origin HEAD:automation/runtime-csp-trust-20260909
