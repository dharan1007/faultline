name: ci
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply abort-listener lifecycle fix on feature branch
        if: github.ref == 'refs/heads/fix/webmcp-abort-listener-cleanup'
        run: python -c "from pathlib import Path; import base64; p=Path('src/runtime.js'); t=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new))"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Commit exact green runtime tree
        if: github.ref == 'refs/heads/fix/webmcp-abort-listener-cleanup'
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/apply-webmcp-abort-listener-cleanup.yml
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime.js .github/workflows/ci.yml package.json tests/webmcp-abort-listener-cleanup.mjs
          git commit -m "fix: detach completed WebMCP abort listeners"
          git push origin HEAD:fix/webmcp-abort-listener-cleanup
