name: Apply capture hardening patch

on:
  push:
    branches:
      - automation/playwright-capture-hardening-20260909

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'chore: run capture hardening patch v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/playwright-capture-hardening-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-capture-runtime-hardening.mjs
      - run: |
          set -euo pipefail
          git config user.name dharan
          git config user.email 150376358+dharan1007@users.noreply.github.com
          git add src/runtime.js src/capture-integration.js src/ui.js tests/browser-e2e.mjs
          git commit -m 'feat: make Playwright capture transactional and agent-native'
          git push origin HEAD:automation/playwright-capture-hardening-20260909
