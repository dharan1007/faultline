name: self-hosted-qualification
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main SHA to qualify (blank uses current main)
        required: false
        type: string
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64, production-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Bind qualification to exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          test "$head" = "$main" || { echo "FAULTLINE_QUALIFICATION_NOT_CURRENT_MAIN"; exit 1; }
          requested='${{ inputs.sha }}'
          if [ -n "$requested" ]; then
            test "$requested" = "$head" || { echo "FAULTLINE_QUALIFICATION_SHA_MISMATCH"; exit 1; }
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Dependency security gate
        run: npm audit --audit-level=high --omit=dev
      - name: Unit, contract and syntax gates
        run: |
          npm test
          npm run check
          node --test tests/deploy-production-contract.test.js
          node scripts/qualification-gate.mjs
      - name: Build and package evidence
        run: |
          npm run build
          npm run sbom
          npm run verify:package
      - name: Install pinned browser binaries
        run: ./node_modules/.bin/playwright install chromium firefox webkit
      - name: Live and reducer browser qualification
        run: |
          node tests/playwright-live.mjs | tee faultline-live-browser.jsonl
          node tests/reduction-corpus.mjs | tee faultline-browser-corpus.jsonl
          npm run test:browser
          node tests/cross-browser-production.mjs
          node tests/cli-browser.mjs
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faultline-self-hosted-evidence-${{ github.sha }}
          path: |
            faultline-live-browser.jsonl
            faultline-browser-corpus.jsonl
            artifacts/faultline-qualification-summary.json
            artifacts/faultline.spdx.json
            public/release.json
            public/integrity.json
          retention-days: 30
          if-no-files-found: error
