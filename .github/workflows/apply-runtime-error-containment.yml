name: Apply runtime error containment fix
on:
  push:
    branches: [tdd/result-forgery-containment]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent candidate exceptions from escaping trusted sandbox evidence
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/runtime.js')
          s=p.read_text()
          old="addEventListener('error',e=>{runtimeError=String(e.message||e.error||'runtime error')});"
          new="addEventListener('error',e=>{runtimeError=String(e.message||e.error||'runtime error');e.preventDefault()});"
          if old not in s:
              raise SystemExit('expected trusted runtime error listener not found')
          p.write_text(s.replace(old,new,1))
      - name: Remove one-shot patch workflow
        run: git rm .github/workflows/apply-runtime-error-containment.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: contain sandbox candidate runtime errors'
          git push
